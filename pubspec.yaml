name: tailor_shop_manager
description: A production-ready Tailor Shop Manager Android application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # File & Storage
  path_provider: ^2.1.3

  # Image Picker
  image_picker: ^1.1.2

  # PDF Generation
  pdf: ^3.10.8
  printing: ^5.13.1

  # Excel Export
  excel: ^4.0.6

  # File Sharing
  share_plus: ^10.0.2

  # Permissions
  permission_handler: ^11.3.1

  # Date & Time
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

  # Shared Preferences (for settings)
  shared_preferences: ^2.3.2

  # File Picker (for backup restore)
  file_picker: ^8.1.2

  # UUID
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
